<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cliente — VJ CONNECT</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#111;display:grid;place-items:center;padding:18px}
.page{width:min(430px,100%);min-height:720px;border-radius:30px;padding:18px;background:#f5efe4;color:#171717;box-shadow:0 25px 80px #0008}
.banner{height:190px;border-radius:20px;background:#181818 center/cover}.logo{display:block;width:90px;height:90px;border-radius:50%;object-fit:cover;margin:-45px auto 12px;border:4px solid #f5efe4;background:#222}
.name{text-align:center;font-size:25px;font-weight:900}.bio{text-align:center;opacity:.65;font-size:13px;line-height:1.5;margin:7px 15px 20px}
.link{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;padding:15px;border-radius:15px;margin:10px 0;font-weight:800}
.link img{width:21px;height:21px}.footer{text-align:center;font-size:9px;letter-spacing:.12em;opacity:.5;margin-top:20px}
.error{text-align:center;padding:50px 20px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const icons={instagram:"https://cdn.simpleicons.org/instagram",whatsapp:"https://cdn.simpleicons.org/whatsapp",google:"https://cdn.simpleicons.org/google",maps:"https://cdn.simpleicons.org/googlemaps",tiktok:"https://cdn.simpleicons.org/tiktok",facebook:"https://cdn.simpleicons.org/facebook",youtube:"https://cdn.simpleicons.org/youtube",link:"https://cdn.simpleicons.org/link"};
const demo={name:"Sua empresa",bio:"Tecnologia que aproxima",logo:"",banner:"",bg:"#f5efe4",bg2:"#e8dcc6",text:"#171717",button:"#151515",buttonText:"#fff",accent:"#d8b45d",bgMode:"solid",gradientDir:"135deg",buttonStyle:"solid",links:[{label:"Instagram",url:"https://instagram.com/",icon:"instagram"},{label:"WhatsApp",url:"https://wa.me/",icon:"whatsapp"},{label:"Google",url:"https://google.com/",icon:"google"},{label:"Como chegar",url:"https://maps.google.com/",icon:"maps"}]};
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(c){
const bg=c.bgMode==="gradient"?`linear-gradient(${c.gradientDir||"135deg"},${c.bg||"#f5efe4"},${c.bg2||"#e8dcc6"})`:c.bg||"#f5efe4";
const btn=c.buttonStyle==="gradient"?`linear-gradient(135deg,${c.button||"#151515"},${c.accent||"#d8b45d"})`:c.buttonStyle==="outline"?"transparent":c.button||"#151515";
const border=c.buttonStyle==="outline"?`2px solid ${c.accent||"#d8b45d"}`:"1px solid transparent";
const links=(c.links||[]).map(x=>`<a class="link" style="background:${btn};border:${border};color:${c.buttonText||"#fff"}" href="${esc(x.url)}" target="_blank" rel="noopener"><img src="${x.icon_url||icons[x.icon]||icons.link}">${esc(x.label)}</a>`).join("");
document.getElementById("app").innerHTML=`<div class="page" style="background:${bg};color:${c.text||"#171717"}">
${c.banner?`<div class="banner" style="background-image:url('${c.banner}')"></div>`:`<div class="banner"></div>`}
${c.logo?`<img class="logo" src="${c.logo}">`:""}
<div class="name">${esc(c.name||"Sua empresa")}</div><div class="bio">${esc(c.bio||"")}</div>${links}
<div class="footer">TECNOLOGIA QUE APROXIMA</div></div>`;
}
const params=new URLSearchParams(location.search);
let data=null;
try{data=JSON.parse(localStorage.getItem("vjconnect_demo")||"null")}catch(e){}
render(data||demo);
</script>
</body>
</html>
