<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>VJ CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,a{font:inherit}
#app{width:100%;min-height:100vh}
.page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:clamp(16px,3vw,48px);
}
.content{
  width:100%;
  max-width:720px;
  min-height:calc(100vh - clamp(32px,6vw,96px));
}
.banner{
  width:100%;
  height:clamp(170px,30vw,300px);
  border-radius:clamp(18px,3vw,28px);
  background:#ddd center/cover no-repeat;
  box-shadow:0 18px 50px rgba(0,0,0,.12);
}
.profile{text-align:center;padding:0 12px}
.logo{
  width:clamp(82px,16vw,118px);
  height:clamp(82px,16vw,118px);
  margin:calc(clamp(82px,16vw,118px)/-2) auto 14px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  border:4px solid currentColor;
  background:#222;
  box-shadow:0 10px 30px rgba(0,0,0,.16);
}
.name{
  font-size:clamp(25px,5vw,40px);
  line-height:1.1;
  font-weight:900;
  overflow-wrap:anywhere;
}
.bio{
  margin:10px auto 24px;
  max-width:620px;
  font-size:clamp(14px,2vw,17px);
  line-height:1.55;
  opacity:.7;
  overflow-wrap:anywhere;
}
.links{display:grid;gap:12px}
.plink{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  padding:14px 18px;
  text-decoration:none;
  font-weight:850;
  border-radius:16px;
  transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease;
  word-break:break-word;
}
.plink:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
.plink:active{transform:scale(.985)}
.plink img{width:23px;height:23px;object-fit:contain;flex:none}
.footer{text-align:center;margin-top:26px;font-size:9px;letter-spacing:.14em;opacity:.45}
.state{
  min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center
}
.loader{opacity:.65}
@media(max-width:600px){
  .page{padding:12px}
  .content{min-height:calc(100vh - 24px)}
  .banner{border-radius:18px}
}
@media(min-width:1000px){
  .page{padding-top:40px;padding-bottom:40px}
}
</style>
</head>

<body>
<div id="app">
  <div class="state"><div class="loader">Carregando página…</div></div>
</div>

<script>
const SUPABASE_URL="https://dciunhrttojsctdlmfvj.supabase.co";
const SUPABASE_KEY="sb_publishable_pH3oQXt64KP-aN9hCqaFrQ_kZ1L6lM8";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const icons={
  instagram:"https://cdn.simpleicons.org/instagram",
  whatsapp:"https://cdn.simpleicons.org/whatsapp",
  google:"https://cdn.simpleicons.org/google",
  maps:"https://cdn.simpleicons.org/googlemaps",
  tiktok:"https://cdn.simpleicons.org/tiktok",
  facebook:"https://cdn.simpleicons.org/facebook",
  youtube:"https://cdn.simpleicons.org/youtube",
  link:"https://cdn.simpleicons.org/link"
};

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function getSlug(){
  const params=new URLSearchParams(location.search);
  const querySlug=params.get("slug");
  if(querySlug)return querySlug.trim().toLowerCase();

  const parts=location.pathname.split("/").filter(Boolean);
  const clientIndex=parts.indexOf("client");
  if(clientIndex>=0 && parts[clientIndex+1]){
    return decodeURIComponent(parts[clientIndex+1]).toLowerCase();
  }

  return "";
}

function safeUrl(url){
  if(!url)return "#";
  try{
    const u=new URL(url,location.href);
    if(["http:","https:"].includes(u.protocol))return u.href;
  }catch(e){}
  return "#";
}

function visual(theme){
  theme=theme||{};
  const bg=theme.bg||"#f5efe4";
  const bg2=theme.bg2||"#e8dcc6";
  const accent=theme.accent||"#d8b45d";
  const text=theme.text||"#171717";
  const button=theme.button||"#151515";
  const buttonText=theme.buttonText||"#ffffff";

  const background=theme.bgMode==="gradient"
    ? `linear-gradient(${theme.gradientDir||"135deg"},${bg},${bg2})`
    : bg;

  let buttonBackground=button;
  if(theme.buttonStyle==="gradient"){
    buttonBackground=`linear-gradient(135deg,${button},${accent})`;
  }
  if(theme.buttonStyle==="outline"){
    buttonBackground="transparent";
  }

  const border=theme.buttonStyle==="outline"
    ? `2px solid ${accent}`
    : "1px solid transparent";

  return {background,text,buttonBackground,buttonText,border};
}

function render(client,links){
  const t=visual(client.theme);
  document.title=(client.name||"VJ CONNECT")+" — VJ CONNECT";

  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content",client.theme?.bg||"#f5efe4");

  const linksHtml=links.map(x=>{
    const iconUrl=x.icon_url||icons[x.icon_key]||icons.link;
    return `
      <a class="plink"
         href="${esc(safeUrl(x.url))}"
         target="_blank"
         rel="noopener noreferrer"
         style="background:${esc(t.buttonBackground)};border:${esc(t.border)};color:${esc(t.buttonText)}">
        <img src="${esc(iconUrl)}" alt="">
        <span>${esc(x.label||"Link")}</span>
      </a>`;
  }).join("");

  document.getElementById("app").innerHTML=`
    <main class="page" style="background:${esc(t.background)};color:${esc(t.text)}">
      <div class="content">
        ${
          client.banner_url
          ? `<div class="banner" style="background-image:url('${esc(client.banner_url)}')"></div>`
          : `<div class="banner"></div>`
        }

        <section class="profile">
          ${
            client.logo_url
            ? `<img class="logo" src="${esc(client.logo_url)}" alt="${esc(client.name||"Logo")}">`
            : ""
          }

          <div class="name">${esc(client.name||"Nome da empresa")}</div>
          <div class="bio">${esc(client.bio||"")}</div>
        </section>

        <section class="links">${linksHtml}</section>

        <div class="footer">VJ CONNECT · TECNOLOGIA QUE APROXIMA</div>
      </div>
    </main>`;
}

async function load(){
  const slug=getSlug();

  if(!slug){
    document.getElementById("app").innerHTML=
      '<div class="state"><div>Página não encontrada.</div></div>';
    return;
  }

  const {data:client,error:clientError}=await db
    .from("clients")
    .select("*")
    .eq("slug",slug)
    .eq("published",true)
    .maybeSingle();

  if(clientError){
    console.error(clientError);
    document.getElementById("app").innerHTML=
      '<div class="state"><div>Não foi possível carregar esta página.</div></div>';
    return;
  }

  if(!client){
    document.getElementById("app").innerHTML=
      '<div class="state"><div>Cliente não encontrado.</div></div>';
    return;
  }

  const {data:links,error:linksError}=await db
    .from("client_links")
    .select("*")
    .eq("client_id",client.id)
    .eq("enabled",true)
    .order("position",{ascending:true});

  if(linksError){
    console.error(linksError);
    render(client,[]);
    return;
  }

  render(client,links||[]);
}

load();
</script>
</body>
</html>
