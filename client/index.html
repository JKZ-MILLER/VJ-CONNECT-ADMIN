<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VJ CONNECT</title>
<link rel="icon" type="image/png" href="../assets/vj-connect-logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,Arial,sans-serif;background:#090909}
body{min-height:100dvh}.page{width:100%;min-height:100dvh;padding:18px;display:flex;flex-direction:column}.inner{width:min(520px,100%);margin:0 auto;flex:1}
.banner{height:220px;border-radius:22px;background:#181818 center/cover}.logo{display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;margin:-48px auto 12px;border:4px solid currentColor;background:#222}.name{text-align:center;font-size:29px;font-weight:950;line-height:1.08}.verify{text-align:center;font-size:11px;font-weight:800;margin:7px 0}.bio{text-align:center;font-size:14px;line-height:1.55;margin:9px 20px 24px}.link{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;padding:16px;margin:11px 0;font-weight:850;transition:transform .15s,filter .15s}.link:hover{transform:translateY(-2px);filter:brightness(1.06)}.link img{width:22px;height:22px}.footer{text-align:center;font-size:8px;letter-spacing:.15em;margin-top:28px;opacity:.45;padding-bottom:10px}.msg{color:#fff;text-align:center;padding:35px}
@media(min-width:700px){.page{padding:28px}.inner{min-height:calc(100dvh - 56px);padding:0}.banner{height:250px}}
</style>

<style>
:root{--gold:#d9ae4a;--gold2:#f4d27b}
body{background:radial-gradient(900px 500px at 50% -10%,rgba(217,174,74,.12),transparent 60%),#050505}
/* Background is intentionally inherited from the per-client inline style below. */
.page{position:relative;overflow:hidden}
.page:before{content:"";position:fixed;width:55vw;height:55vw;max-width:700px;max-height:700px;left:-28vw;top:-15vw;border:1px solid rgba(217,174,74,.20);border-radius:50%;box-shadow:0 0 80px rgba(217,174,74,.06);pointer-events:none}
.page:after{content:"";position:fixed;width:42vw;height:42vw;max-width:550px;max-height:550px;right:-22vw;bottom:-18vw;border:1px solid rgba(217,174,74,.18);border-radius:50%;pointer-events:none}
.inner{position:relative;z-index:1;padding-bottom:24px}
.banner{box-shadow:0 18px 55px rgba(0,0,0,.35),0 0 0 1px rgba(217,174,74,.10)}
.logo{box-shadow:0 0 0 4px rgba(217,174,74,.18),0 0 45px rgba(217,174,74,.28);border-color:var(--gold)!important}
.name{letter-spacing:-.03em}.link{box-shadow:0 10px 30px rgba(0,0,0,.20);border:1px solid rgba(217,174,74,.10)}
.footer{color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<main id="app"><div class="msg">Carregando...</div></main>
<script>
const SUPABASE_URL="https://dciunhrttojsctdlmfvj.supabase.co";
const SUPABASE_KEY="sb_publishable_pH3oQXt64KP-aN9hCqaFrQ_kZ1L6lM8";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const icons={instagram:"https://cdn.simpleicons.org/instagram",whatsapp:"https://cdn.simpleicons.org/whatsapp",google:"https://cdn.simpleicons.org/google",maps:"https://cdn.simpleicons.org/googlemaps",tiktok:"https://cdn.simpleicons.org/tiktok",facebook:"https://cdn.simpleicons.org/facebook",youtube:"https://cdn.simpleicons.org/youtube",link:"https://cdn.simpleicons.org/link",stars:"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27%23d9ae4a%27%3E%3Cpath d=%27m12 2.6 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 16.8l-5.56 2.92 1.06-6.2L3 9.13l6.22-.9L12 2.6z%27/%3E%3C/svg%3E",menu:"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23ffffff%27 stroke-width=%272%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M5 4h14v16H5z%27/%3E%3Cpath d=%27M8 8h8M8 12h8M8 16h5%27/%3E%3C/svg%3E"};
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const normalizeUrl=v=>/^https?:\/\//i.test(String(v||"").trim())?String(v).trim():"https://"+String(v||"").trim();

async function load(){
 const slug=new URLSearchParams(location.search).get("slug");
 if(!slug){app.innerHTML='<div class="msg">Página não encontrada.</div>';return}
 const r=await db.from("clients").select("*").eq("slug",slug).eq("published",true).single();
 if(r.error||!r.data){app.innerHTML='<div class="msg">Página não encontrada ou ainda não publicada.</div>';return}
 const c=r.data,t=c.theme||{};
 const lr=await db.from("client_links").select("*").eq("client_id",c.id).eq("enabled",true).order("position",{ascending:true});
 if(lr.error){app.innerHTML='<div class="msg">Não foi possível carregar os links desta página.</div>';return}
 const bg=t.bgMode==="gradient"?`linear-gradient(${t.gradientDir||"135deg"},${t.bg||"#f5efe4"},${t.bg2||"#e8dcc6"})`:t.bg||"#f5efe4";
 const button=t.buttonStyle==="gradient"?`linear-gradient(135deg,${t.button||"#151515"},${t.accent||"#d8b45d"})`:t.buttonStyle==="outline"?"transparent":t.button||"#151515";
 const border=t.buttonStyle==="outline"?`2px solid ${t.accent||"#d8b45d"}`:"1px solid transparent";
 const radius=Number(t.buttonRadius??15);
 document.title=c.name+" — VJ CONNECT";
 app.innerHTML=`<div class="page" style="background:${bg};color:${t.text||"#171717"}"><div class="inner">
 ${c.banner_url?`<div class="banner" style="background-image:url('${esc(c.banner_url)}')"></div>`:`<div class="banner"></div>`}
 ${c.logo_url?`<img class="logo" src="${esc(c.logo_url)}" alt="Logo ${esc(c.name)}">`:""}
 <div class="name">${esc(c.name)}</div>
 ${t.verifyText?`<div class="verify">✓ ${esc(t.verifyText)}</div>`:""}
 <div class="bio" style="opacity:.68">${esc(c.bio||"")}</div>
 ${(lr.data||[]).map(x=>`<a class="link" style="background:${button};border:${border};color:${t.buttonText||"#fff"};border-radius:${radius}px" href="${esc(normalizeUrl(x.url))}" target="_blank" rel="noopener noreferrer"><img src="${esc(x.icon_url||icons[x.icon_key]||icons.link)}" alt="">${esc(x.label)}</a>`).join("")}
 <div class="footer">VJ CONNECT · TECNOLOGIA QUE APROXIMA</div>
 </div></div>`;
}
load();
</script>
</body>
</html>
