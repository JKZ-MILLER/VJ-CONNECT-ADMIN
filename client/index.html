<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VJ CONNECT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#090909;color:#fff;min-height:100vh}.shell{width:100%;min-height:100vh;margin:0;padding:0}.top{text-align:center;color:#8e8a82;font-size:10px;letter-spacing:.2em;margin-bottom:16px}.page{width:100%;min-height:100vh;border-radius:0;padding:clamp(14px,3vw,36px);background:#f5efe4;color:#171717}.banner{height:190px;border-radius:20px;background:#171717 center/cover no-repeat;overflow:hidden}.logo{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;margin:-44px auto 12px;position:relative;border:3px solid #f5efe4;box-shadow:0 5px 18px #0003;background:#222}.name{text-align:center;font-size:25px;font-weight:950}.bio{text-align:center;color:#6d675e;font-size:13px;line-height:1.5;margin:8px 18px 20px}.links{display:grid;gap:10px}.link{display:flex;align-items:center;justify-content:center;gap:10px;background:#151515;color:#fff;border-radius:15px;padding:15px;font-weight:850;transition:.2s;box-shadow:0 8px 20px #0001}.link:hover{transform:translateY(-2px)}.link img{width:22px;height:22px}.foot{text-align:center;color:#8e887e;font-size:9px;letter-spacing:.12em;margin-top:24px}.error{text-align:center;padding:100px 20px}.loader{text-align:center;padding:100px;color:#777}
</style></head><body><div class="shell"><div class="top">VJ CONNECT</div><div id="app" class="loader">Carregando experiência...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../admin/config.js"></script>
<script>
const demo={name:"Página VJ CONNECT",bio:"Tecnologia que aproxima",logo_url:"",banner_url:"",theme:{},links:[
{label:"Instagram",url:"https://instagram.com/",icon_key:"instagram"},
{label:"WhatsApp",url:"https://wa.me/",icon_key:"whatsapp"},
{label:"Google",url:"https://google.com/",icon_key:"google"},
{label:"Como chegar",url:"https://maps.google.com/",icon_key:"maps"}]};
const icons={instagram:"https://cdn.simpleicons.org/instagram",whatsapp:"https://cdn.simpleicons.org/whatsapp",google:"https://cdn.simpleicons.org/google",maps:"https://cdn.simpleicons.org/googlemaps",tiktok:"https://cdn.simpleicons.org/tiktok",facebook:"https://cdn.simpleicons.org/facebook",youtube:"https://cdn.simpleicons.org/youtube",link:"https://cdn.simpleicons.org/link"};
function render(c,links){let t=c.theme||{};document.documentElement.style.setProperty("--accent",t.accent||"#d8b45d");const logo=c.logo_url?`<img class="logo" src="${c.logo_url}">`:"";const banner=c.banner_url?`<div class="banner" style="background-image:url('${c.banner_url}')"></div>`:`<div class="banner"></div>`;document.getElementById("app").className="page";document.getElementById("app").innerHTML=`${banner}${logo}<div class="name">${safe(c.name)}</div><div class="bio">${safe(c.bio||"")}</div><div class="links">${links.filter(x=>x.enabled).sort((a,b)=>a.position-b.position).map(l=>`<a class="link" href="${safe(l.url)}" target="_blank" rel="noopener"><img src="${l.icon_url||icons[l.icon_key]||icons.link}">${safe(l.label)}</a>`).join("")}</div><div class="foot">VJ CONNECT · TECNOLOGIA QUE APROXIMA</div>`}
function safe(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
(async()=>{const slug=new URLSearchParams(location.search).get("slug");if(!slug){render(demo,demo.links);return}if(!window.VJ_SUPABASE?.url){document.getElementById("app").innerHTML='<div class="error"><h2>Configuração pendente</h2><p>Conecte o projeto ao Supabase.</p></div>';return}const sb=supabase.createClient(VJ_SUPABASE.url,VJ_SUPABASE.anonKey);const {data:c,error}=await sb.from("clients").select("*").eq("slug",slug).eq("published",true).single();if(error||!c){document.getElementById("app").innerHTML='<div class="error"><h2>Página não encontrada</h2><p>Verifique o endereço da sua tag NFC.</p></div>';return}const {data:links}=await sb.from("client_links").select("*").eq("client_id",c.id).eq("enabled",true).order("position");render(c,links||[])})();
</script></body></html>
