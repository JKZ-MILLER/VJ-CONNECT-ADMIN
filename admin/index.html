<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VJ CONNECT · Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Inter,system-ui,Arial,sans-serif}.top{height:66px;border-bottom:1px solid #29251f;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#090909ee;backdrop-filter:blur(14px);z-index:10}.brand{font-weight:950;letter-spacing:.14em}.gold{color:#d8b45d}.actions{display:flex;gap:8px}.btn{border:1px solid #3a3328;background:#171717;color:#ddd;padding:10px 14px;border-radius:11px;font-weight:850;cursor:pointer}.primary{background:#d8b45d;color:#090909;border-color:#d8b45d}.layout{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 66px)}.panel{padding:24px;border-right:1px solid #29251f;overflow:auto}.stage{position:relative;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 50% 40%,#1b1710,#080808 65%)}h1{font-size:25px;margin:0 0 5px}.muted{color:#918b82;font-size:13px;line-height:1.5}.section{border-top:1px solid #29251f;margin-top:20px;padding-top:18px}label{display:block;text-transform:uppercase;letter-spacing:.12em;color:#aaa39a;font-size:10px;margin:12px 0 6px}input,select{width:100%;background:#121212;border:1px solid #332d24;color:#eee;padding:11px;border-radius:10px;outline:none}.links{display:grid;gap:8px}.link{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:7px;align-items:center;background:#121212;border:1px solid #29251f;padding:8px;border-radius:12px}.link img{width:21px;height:21px}.mini{padding:7px}.danger{background:#251212;color:#ffaaaa}.phone{width:360px;max-width:92vw;height:700px;border:10px solid #151515;border-radius:42px;background:#f5efe4;overflow:hidden;box-shadow:0 30px 100px #000}.screen{height:100%;overflow:auto;padding:18px;background:#f5efe4;color:#171717}.banner{height:170px;background:#171717 center/cover;border-radius:19px}.plogo{width:84px;height:84px;display:block;margin:-42px auto 12px;border-radius:50%;object-fit:cover;border:3px solid #f5efe4;background:#222;position:relative}.pname{text-align:center;font-weight:950;font-size:22px}.pbio{text-align:center;color:#6d675e;font-size:12px;margin:6px 15px 18px}.plink{display:flex;align-items:center;justify-content:center;gap:9px;background:#151515;color:#fff;padding:14px;border-radius:14px;margin:9px 0;font-weight:850}.plink img{width:21px;height:21px}.tag{font-size:9px;text-align:center;color:#999;margin-top:18px;letter-spacing:.12em}.notice{padding:11px;border:1px solid #4a3c20;background:#19150e;color:#d9caa5;border-radius:10px;font-size:12px;margin-top:12px}.hidden{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid #29251f}.stage{min-height:760px}}
</style></head><body>
<header class="top"><div class="brand">VJ <span class="gold">CONNECT</span></div><div class="actions"><button class="btn" onclick="logout()">Sair</button></div></header>
<div id="login" style="max-width:430px;margin:90px auto;padding:25px"><h1>Área restrita</h1><p class="muted">Somente o administrador VJ CONNECT pode criar e editar páginas.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button class="btn primary" style="width:100%;margin-top:15px" onclick="login()">ENTRAR</button><div id="msg" class="notice"></div></div>
<div id="app" class="layout hidden"><aside class="panel"><h1>Editor do cliente</h1><p class="muted">Crie a página no template mestre. A prévia acompanha cada alteração.</p>
<div class="section"><label>Nome</label><input id="name" oninput="state.name=this.value;autoSlug();preview()"><label>Slug / endereço</label><input id="slug" oninput="state.slug=this.value;preview()"><label>Descrição</label><input id="bio" oninput="state.bio=this.value;preview()"><label>Logo</label><input id="logo" type="file" accept="image/*" onchange="uploadPreview(this,'logo_url')"><label>Banner</label><input id="banner" type="file" accept="image/*" onchange="uploadPreview(this,'banner_url')"></div>
<div class="section"><div style="display:flex;justify-content:space-between;align-items:center"><b>Blocos / links</b><button class="btn" onclick="addLink()">+ Adicionar</button></div><div id="links" class="links"></div></div>
<div class="section"><label>Cor de destaque</label><input id="accent" type="text" value="#d8b45d" oninput="state.theme.accent=this.value;preview()"><label>Arredondamento</label><select id="radius" onchange="state.theme.radius=this.value;preview()"><option value="12">12px</option><option value="16" selected>16px</option><option value="22">22px</option></select></div>
<div class="section"><button class="btn primary" style="width:100%" onclick="saveClient()">CRIAR / SALVAR PÁGINA</button><button class="btn" style="width:100%;margin-top:8px" onclick="openClient()">ABRIR PÁGINA DO CLIENTE</button><div id="status" class="muted" style="margin-top:10px"></div></div>
</aside><main class="stage"><div class="phone"><div id="preview" class="screen"></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
let sb=null,currentId=null,state={name:"",bio:"Tecnologia que aproxima",logo_url:"",banner_url:"",slug:"",theme:{accent:"#d8b45d",radius:"16"},links:[
{label:"Instagram",url:"https://instagram.com/",icon_key:"instagram",icon_url:"",enabled:true},
{label:"WhatsApp",url:"https://wa.me/",icon_key:"whatsapp",icon_url:"",enabled:true},
{label:"Google",url:"https://google.com/",icon_key:"google",icon_url:"",enabled:true},
{label:"Como chegar",url:"https://maps.google.com/",icon_key:"maps",icon_url:"",enabled:true}]};
const icons={instagram:"https://cdn.simpleicons.org/instagram",whatsapp:"https://cdn.simpleicons.org/whatsapp",google:"https://cdn.simpleicons.org/google",maps:"https://cdn.simpleicons.org/googlemaps",tiktok:"https://cdn.simpleicons.org/tiktok",facebook:"https://cdn.simpleicons.org/facebook",youtube:"https://cdn.simpleicons.org/youtube",site:"https://cdn.simpleicons.org/googlechrome",cardapio:"https://cdn.simpleicons.org/foodpanda",pix:"https://cdn.simpleicons.org/pix",link:"https://cdn.simpleicons.org/link"};
function safe(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function preview(){let l=state.links.filter(x=>x.enabled);document.getElementById("preview").innerHTML=`${state.banner_url?`<div class="banner" style="background-image:url('${state.banner_url}')"></div>`:'<div class="banner"></div>'}${state.logo_url?`<img class="plogo" src="${state.logo_url}">`:''}<div class="pname">${safe(state.name||"Nome da empresa")}</div><div class="pbio">${safe(state.bio)}</div>${l.map(x=>`<a class="plink" href="${safe(x.url)}" target="_blank"><img src="${x.icon_url||icons[x.icon_key]||icons.link}">${safe(x.label)}</a>`).join("")}<div class="tag">VJ CONNECT · TECNOLOGIA QUE APROXIMA</div>`}
function drawLinks(){document.getElementById("links").innerHTML=state.links.map((l,i)=>`<div class="link"><img src="${l.icon_url||icons[l.icon_key]||icons.link}"><input value="${safe(l.label)}" oninput="state.links[${i}].label=this.value;preview()"><input value="${safe(l.url)}" oninput="state.links[${i}].url=this.value;preview()"><button class="btn mini danger" title="Apagar link" aria-label="Apagar link" onclick="state.links.splice(${i},1);drawLinks();preview()">🗑</button></div>`).join("");preview()}
function addLink(){state.links.push({label:"Novo link",url:"#",icon_key:"link",icon_url:"",enabled:true});drawLinks()}
async function login(){
  if(!sb)return msg("Supabase não configurado. Verifique admin/config.js.");
  const emailValue=document.getElementById("email").value.trim();
  const passwordValue=document.getElementById("password").value;
  if(!emailValue||!passwordValue)return msg("Informe e-mail e senha.");
  const {data,error}=await sb.auth.signInWithPassword({email:emailValue,password:passwordValue});
  if(error)return msg(error.message);
  if(!data?.session)return msg("Não foi possível iniciar uma sessão.");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  drawLinks();
}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
function msg(x){document.getElementById("msg").textContent=x}
async function boot(){
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}
async function uploadPreview(input,key){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state[key]=r.result;preview()};r.readAsDataURL(f)}
function slug(x){
  return String(x||"").toLowerCase().normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"") || "";
}
function autoSlug(){
  if(!state.slug || state.slug===slug(state.name)){
    state.slug=slug(state.name);
    const el=document.getElementById("slug");
    if(el)el.value=state.slug;
  }
}
async function saveClient(){
  if(!sb)return msg("Supabase não configurado. Verifique admin/config.js.");
  const name=state.name.trim();
  const clientSlug=slug(state.slug||name);
  if(!name)return msg("Digite o nome da empresa.");
  if(!clientSlug)return msg("Informe nome e slug.");

  const base={
    slug:clientSlug,
    name,
    bio:state.bio||"",
    logo_url:state.logo_url||"",
    banner_url:state.banner_url||"",
    theme:state.theme||{},
    published:true
  };

  const {data:c,error}=await sb.from("clients").insert(base).select().single();
  if(error){
    console.error(error);
    return msg("Erro ao salvar cliente: "+error.message);
  }

  currentId=c.id;
  const rows=state.links.map((x,i)=>({
    client_id:c.id,
    position:i,
    label:x.label||"Link",
    url:x.url||"#",
    icon_key:x.icon_key||"link",
    icon_url:x.icon_url||"",
    enabled:x.enabled!==false
  }));

  if(rows.length){
    const {error:e2}=await sb.from("client_links").insert(rows);
    if(e2){
      console.error(e2);
      await sb.from("clients").delete().eq("id",c.id);
      return msg("Cliente não foi criado porque os links falharam: "+e2.message);
    }
  }

  document.getElementById("status").textContent=
    "Página criada com sucesso: ../client/index.html?slug="+encodeURIComponent(c.slug);
  window.open("../client/index.html?slug="+encodeURIComponent(c.slug),"_blank");
}
function openClient(){if(!currentId)return msg("Salve/crie a página primeiro.");}
(async()=>{if(window.VJ_SUPABASE?.url&&window.VJ_SUPABASE?.anonKey)sb=supabase.createClient(VJ_SUPABASE.url,VJ_SUPABASE.anonKey);await boot()})();
</script></body></html>
